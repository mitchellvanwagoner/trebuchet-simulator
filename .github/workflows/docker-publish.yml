name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: trebuchet-smoke-test

      # Boot the freshly built image and require the Streamlit health endpoint to
      # come up before anything is published. Catches broken CMD/deps/permissions.
      #
      # /app/data is bind-mounted from a host folder deliberately owned by a
      # foreign uid (65534/nobody, never the image's uid 1000) - the same shape
      # as a real DATA_DIR bind mount or Unraid appdata share - and the write
      # check below confirms the entrypoint's chown-then-drop-privileges step
      # actually made it writable, instead of only checking the image boots.
      - name: Smoke test image
        run: |
          mkdir -p /tmp/smoke-data
          sudo chown 65534:65534 /tmp/smoke-data
          docker run -d --name smoke -p 8501:8501 -v /tmp/smoke-data:/app/data trebuchet-smoke-test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health > /dev/null 2>&1; then
              echo "Health endpoint responded"
              docker exec smoke sh -c 'echo ok > /app/data/permission-check.tmp && rm /app/data/permission-check.tmp'
              echo "/app/data is writable with a foreign-owned bind mount"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "Image failed to become healthy within 60s; container logs:"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # Same context and builder as the smoke-test build, so this is a cache hit.
      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
